<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Derivative Card Game - Lobby</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f0c1b 0%, #1a102f 50%, #130924 100%);
            height: 100vh; width: 100vw; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #f3e8ff;
        }

        .title {
            font-size: 3rem; font-weight: 900;
            background: linear-gradient(to right, #c084fc, #f472b6);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 8px; text-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .subtitle { color: #a78bfa; margin-bottom: 32px; font-size: 1.1rem; }

        .lobby-card {
            width: 800px; background: rgba(30, 21, 53, 0.6);
            border: 2px solid #581c87; border-radius: 20px; padding: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5); backdrop-filter: blur(10px);
        }

        .lobby-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid rgba(168, 85, 247, 0.2);
        }
        .lobby-title { font-size: 1.25rem; font-weight: bold; color: #e9d5ff; }

        .btn-group { display: flex; gap: 10px; }
        .btn {
            padding: 10px 20px; border-radius: 12px; font-size: 14px; font-weight: bold;
            cursor: pointer; border: none; transition: all 0.2s ease;
        }
        .btn-create { background: #9333ea; color: white; box-shadow: 0 0 12px rgba(147, 51, 234, 0.4); }
        .btn-create:hover { background: #a855f7; transform: translateY(-2px); }
        .btn-clear { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid #ef4444; }
        .btn-clear:hover { background: rgba(239, 68, 68, 0.4); }

        .table-list { display: flex; flex-direction: column; gap: 12px; max-height: 350px; overflow-y: auto; }
        .table-item {
            background: rgba(19, 9, 36, 0.8); border: 1px solid #7e22ce; border-radius: 14px;
            padding: 16px 20px; display: flex; justify-content: space-between; align-items: center;
        }
        .table-info h3 { font-size: 1.1rem; color: #f3e8ff; margin-bottom: 4px; }
        .table-info p { font-size: 0.85rem; color: #a78bfa; }

        .table-actions { display: flex; align-items: center; gap: 12px; }
        .badge-players {
            background: rgba(168, 85, 247, 0.15); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.3);
            padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: bold;
        }
        .btn-join { background: #22c55e; color: white; padding: 8px 18px; border-radius: 10px; text-decoration: none; font-size: 13px; font-weight: bold; cursor: pointer; border: none; }
        .btn-join:hover { background: #16a34a; }
        .btn-disabled { background: #4b5563 !important; color: #9ca3af !important; cursor: not-allowed !important; border: none !important; }
        
        .btn-stream { background: rgba(168, 85, 247, 0.2); color: #e9d5ff; border: 1px solid #a855f7; padding: 8px 18px; border-radius: 10px; text-decoration: none; font-size: 13px; font-weight: bold; cursor: pointer; }
        .btn-stream:hover { background: rgba(168, 85, 247, 0.4); }
    </style>
</head>
<body>

    <h1 class="title">Derivative Card Game</h1>
    <p class="subtitle">เลือกโต๊ะที่ต้องการเล่น หรือรับชมการแข่งขันสด</p>

    <div class="lobby-card">
        <div class="lobby-header">
            <span class="lobby-title">รายการโต๊ะที่เปิดอยู่</span>
            <div class="btn-group">
                <button class="btn btn-clear" onclick="clearAllTables()">ลบโต๊ะทั้งหมด</button>
                <button class="btn btn-create" onclick="createNewTable()">+ สร้างโต๊ะใหม่</button>
            </div>
        </div>

        <div class="table-list" id="table-container">
            <!-- รายการโต๊ะจาก Firebase จะแสดงที่นี่ -->
        </div>
    </div>

    <!-- Firebase SDK Modular -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDp3MXKZTOyVw_bJ2TJiSv_apHfC3UQEnQ",
            authDomain: "multiplayer-math-game-e021c.firebaseapp.com",
            databaseURL: "https://multiplayer-math-game-e021c-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "multiplayer-math-game-e021c",
            storageBucket: "multiplayer-math-game-e021c.firebasestorage.app",
            messagingSenderId: "389643255813",
            appId: "1:389643255813:web:b4db5d43e392601a7d5c6c",
            measurementId: "G-RYP3M031NV"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        function createInitialGameState() {
            const n1 = 3;
            const n2 = 10;
            const ans = n1 + n2;
            return {
                currentQuestion: { answer: ans, n1: n1, n2: n2 },
                options: [ans, ans + 1, ans - 2, ans + 5]
            };
        }

        document.addEventListener("DOMContentLoaded", () => {
            initDefaultTable();
            listenToTables();
        });

        function initDefaultTable() {
            const tableRef = ref(db, 'tables/MATH-932');
            onValue(tableRef, (snapshot) => {
                if (!snapshot.exists()) {
                    set(tableRef, {
                        id: 'MATH-932',
                        name: 'โต๊ะการแข่งขัน #MATH-932',
                        creator: 'คุณ',
                        isClosed: false,
                        players: {
                            "player1": { joined: false, id: null },
                            "player2": { joined: false, id: null },
                            "player3": { joined: false, id: null },
                            "player4": { joined: false, id: null }
                        },
                        gameState: createInitialGameState()
                    });
                }
            }, { onlyOnce: true });
        }

        function listenToTables() {
            const tablesRef = ref(db, 'tables');
            onValue(tablesRef, (snapshot) => {
                const tables = snapshot.val() || {};
                renderTables(tables);
            });
        }

        function renderTables(tables) {
            const container = document.getElementById('table-container');
            container.innerHTML = '';

            const tableKeys = Object.keys(tables);

            if (tableKeys.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:#a78bfa; padding:20px;">ยังไม่มีโต๊ะที่เปิดอยู่ กด "+ สร้างโต๊ะใหม่" ด้านบนได้เลย</p>`;
                return;
            }

            tableKeys.forEach(key => {
                const table = tables[key];
                const players = table.players || {};
                
                let joinedCount = 0;
                Object.values(players).forEach(p => {
                    if (p && p.joined === true) joinedCount++;
                });

                // โต๊ะจะถือว่าเต็ม/ปิด เมื่อคนครบ 4 หรือสั่งปิด (isClosed)
                const isFull = joinedCount >= 4 || table.isClosed === true;

                const item = document.createElement('div');
                item.className = 'table-item';
                item.innerHTML = `
                    <div class="table-info">
                        <h3>${table.name}</h3>
                        <p>ผู้สร้าง: ${table.creator}</p>
                    </div>
                    <div class="table-actions">
                        <span class="badge-players">ผู้เล่น ${joinedCount}/4 คน</span>
                        <button class="btn btn-join ${isFull ? 'btn-disabled' : ''}" 
                                onclick="window.joinTable('${table.id}')" 
                                ${isFull ? 'disabled' : ''}>
                                ${isFull ? 'เต็มแล้ว (ปิด)' : 'เข้าร่วมเล่น'}
                        </button>
                        <button class="btn btn-stream" onclick="window.watchStream('${table.id}')">รับชม (Stream)</button>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        // 🛠️ ฟังก์ชันเข้าร่วมเล่น: ตรวจสอบที่นั่ง ซิงก์ Firebase และปิดโต๊ะเมื่อครบ 4 คน
        window.joinTable = function(tableId) {
            const tableRef = ref(db, `tables/${tableId}`);

            runTransaction(tableRef, (table) => {
                if (!table) return table;

                // หากโต๊ะถูกสั่งปิดไปแล้ว ให้ยกเลิก
                if (table.isClosed) {
                    return; 
                }

                if (!table.players) {
                    table.players = {
                        "player1": { joined: false, id: null },
                        "player2": { joined: false, id: null },
                        "player3": { joined: false, id: null },
                        "player4": { joined: false, id: null }
                    };
                }

                // สแกนหาเก้าอี้ว่างตัวแรก (1-4) ที่ joined === false
                let availableSlot = null;
                for (let i = 1; i <= 4; i++) {
                    const pKey = `player${i}`;
                    if (!table.players[pKey] || !table.players[pKey].joined) {
                        availableSlot = i;
                        break;
                    }
                }

                // ถ้าไม่มีเก้าอี้ว่าง สั่งปิดโต๊ะทันที
                if (availableSlot === null) {
                    table.isClosed = true;
                    return table;
                }

                // สุ่มรหัสผู้เล่น
                const playerId = 'user_' + Math.random().toString(36).substr(2, 9);
                const targetKey = `player${availableSlot}`;

                // บันทึกสถานะผู้เล่นลงในที่นั่งนั้น
                table.players[targetKey] = {
                    joined: true,
                    id: playerId
                };

                if (!table.gameState) {
                    table.gameState = createInitialGameState();
                }

                // ตรวจสอบจำนวนผู้เล่นรวมทั้งหมดอีกครั้ง
                let activeCount = 0;
                Object.values(table.players).forEach(p => {
                    if (p && p.joined) activeCount++;
                });

                // หากคนเข้าร่วมครบ 4 คน สั่งปิดการเข้าร่วมทันที
                if (activeCount >= 4) {
                    table.isClosed = true;
                }

                // บันทึก Session ชั่วคราวลงในเครื่องผู้เล่น
                sessionStorage.setItem('current_table_id', tableId);
                sessionStorage.setItem('my_player_slot', targetKey);
                sessionStorage.setItem('my_player_id', playerId);

                return table;
            }).then((result) => {
                if (result.committed) {
                    window.location.href = 'PlayerGame.html';
                } else {
                    alert('โต๊ะนี้เต็มแล้ว หรือเกิดข้อผิดพลาดในการเข้าร่วม');
                }
            }).catch((error) => {
                console.error("Join Transaction Failed: ", error);
            });
        };

        window.watchStream = function(tableId) {
            sessionStorage.setItem('current_table_id', tableId);
            window.location.href = 'PreviewPlay.html';
        };

        window.createNewTable = function() {
            const randomNum = Math.floor(100 + Math.random() * 900);
            const newId = `MATH-${randomNum}`;
            const tableRef = ref(db, `tables/${newId}`);

            set(tableRef, {
                id: newId,
                name: `โต๊ะการแข่งขัน #${newId}`,
                creator: 'คุณ',
                isClosed: false,
                players: {
                    "player1": { joined: false, id: null },
                    "player2": { joined: false, id: null },
                    "player3": { joined: false, id: null },
                    "player4": { joined: false, id: null }
                },
                gameState: createInitialGameState()
            });
        };

        window.clearAllTables = function() {
            const tablesRef = ref(db, 'tables');
            remove(tablesRef).then(() => {
                initDefaultTable();
            });
        };
    </script>
</body>
</html>
